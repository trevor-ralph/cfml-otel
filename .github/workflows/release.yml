# On a v* tag: builds lib/, packages the module zip, publishes SHA-256 checksums and a signed
# build-provenance attestation, creates the GitHub release, then publishes it to ForgeBox and the jars to Maven
# Central. Each publish job runs in its own environment ("forgebox", "maven-central") that holds its secrets;
# without them the job only warns.
# Only commits on main are released.
# Verify a download with: gh attestation verify cfml-otel-<version>.zip --repo trevor-ralph/cfml-otel
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release and upload assets
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # all history, so the next step can see main

      # Only admins can create v* tags (the "Protect release tags" ruleset), but a tag can point at any commit:
      # release only what is on main
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a commit on main to release" >&2; exit 1; }

      - name: Check tag matches the version in box.json, ModuleConfig, pom.xml and the bridge
        run: bash tests/check-versions.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}

      # In the pinned build image (docker-compose.yml's build service), like CI: with the poms' fixed
      # project.build.outputTimestamp the jars are reproducible, and the maven-central job checks it uploads these
      # exact jars
      - name: Build lib/
        working-directory: dev
        run: docker compose run --rm --quiet-pull --entrypoint ./build.sh build

      - name: Package
        run: |
          mkdir dist
          zip -r -X "dist/cfml-otel-${TAG#v}.zip" box.json ModuleConfig.cfc README.md CHANGELOG.md LICENSE NOTICE models interceptors lib
          (cd dist && sha256sum -- *.zip > SHA256SUMS)
          unzip -l dist/*.zip
          cat dist/SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Create GitHub release
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # This version's CHANGELOG.md section as the notes (GitHub appends its generated changelog link)
          awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for ${TAG#v}" >&2; exit 1; }
          gh release create "$TAG" dist/* --verify-tag --notes-file notes.md --generate-notes --title "$TAG" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  # ForgeBox gets box.json with its location set to the zip just released (dev/forgebox-publish.sh), so
  # `box install cfml-otel` downloads that same attested zip. Pre-releases (tags with a "-") stay on GitHub.
  # A job of its own, read-only, in the "forgebox" environment: that environment holds FORGEBOX_API_TOKEN and only
  # admits v* tags, so no branch, pull request or other workflow can read the token.
  forgebox:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: forgebox
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish to ForgeBox
        working-directory: dev
        run: |
          if [[ -z "$FORGEBOX_API_TOKEN" ]]; then
            echo "::warning::The forgebox environment has no FORGEBOX_API_TOKEN secret, so this release wasn't published to ForgeBox."
            exit 0
          fi
          docker compose run --rm --quiet-pull forgebox
        env:
          TAG: ${{ github.ref_name }}
          FORGEBOX_API_TOKEN: ${{ secrets.FORGEBOX_API_TOKEN }}

  # Maven Central gets the bridge and the agent extension as io.github.trevor-ralph:cfml-otel-bridge and
  # :cfml-otel-agent-extension (dev/maven-central-publish.sh): rebuilt in the same image, compared byte for byte with
  # the jars in the release zip, then signed and uploaded. Central releases are permanent, so pre-releases stay on
  # GitHub. Read-only, in the "maven-central" environment, which holds the Central Portal token and the signing key
  # and only admits v* tags.
  maven-central:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45     # the plugin waits for Central to finish publishing (up to 30 minutes)
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish to Maven Central
        working-directory: dev
        run: |
          if [[ -z "$MAVEN_CENTRAL_USERNAME" || -z "$MAVEN_CENTRAL_PASSWORD" || -z "$MAVEN_GPG_KEY" || -z "$MAVEN_GPG_PASSPHRASE" ]]; then
            echo "::warning::The maven-central environment is missing a secret (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_KEY, MAVEN_GPG_PASSPHRASE), so this release wasn't published to Maven Central."
            exit 0
          fi
          docker compose run --rm --quiet-pull -e TAG -e MAVEN_CENTRAL_USERNAME -e MAVEN_CENTRAL_PASSWORD \
            -e MAVEN_GPG_KEY -e MAVEN_GPG_PASSPHRASE --entrypoint bash build dev/maven-central-publish.sh
        env:
          TAG: ${{ github.ref_name }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
