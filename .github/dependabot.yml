version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (the repo requires SHA pinning).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The dev/CI stack's images (engines, SQL Server, Grafana LGTM, the Maven build image), pinned by tag and digest: a
  # new tag or a re-pushed one arrives as a PR the full integration matrix has to pass.
  - package-ecosystem: docker-compose
    directory: /dev
    schedule:
      interval: weekly
    ignore:
      # One service per supported Lucee major (6, 7, 8): only move each within its major. A new major is a new
      # service, added by hand.
      - dependency-name: "lucee/lucee"
        update-types: ["version-update:semver-major"]
      # The build image stays on a supported JDK: 25 (LTS) rather than 26, which reached end of life when 27 came
      # out. Dependabot compares Maven tags by a number it builds from the tag, keeping the trailing JDK:
      # 3.9-eclipse-temurin-25 is 3.9.25 and 3.9-eclipse-temurin-26 is 3.9.26. Ignore versions have to be written
      # that way; a tag string here is parsed as a pre-release and never matches. A JDK 27 image for Maven 3.9
      # (3.9.27) would still be proposed. JDK 27 currently exists only for Maven 3.10, which has no arm64 build.
      - dependency-name: "maven"
        versions: ["3.9.26"]

  # The integration-test runner's base image and its hash-pinned pytest requirements
  - package-ecosystem: docker
    directory: /tests/integration
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests/integration
    schedule:
      interval: weekly

  # Build plugins and test libraries for the bridge and the agent extension. OpenTelemetry is deliberately
  # excluded: the API must stay <= the javaagent's bundled SDK version, and opentelemetry-instrumentation-api and
  # the extension API are released with the agent, so all of them move together with AGENT_VERSION in build.sh
  # (tests/check-versions.sh fails a lone bump).
  - package-ecosystem: maven
    directories: ["/java", "/agent-extension"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "io.opentelemetry:*"
      - dependency-name: "io.opentelemetry.instrumentation:*"
      - dependency-name: "io.opentelemetry.javaagent:*"
